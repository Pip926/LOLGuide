{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив Рунтерры | Список оружия</title>
    <link rel="stylesheet" href="{% static 'LOLGuide/css/items_list.css' %}">
</head>
<body class="items-list-body">
    <a href="{% url 'index' %}" class="btn-back">НАЗАД</a>
    <main class="viewport-wrapper">
        
        <aside class="sidebar-items"></aside>

        <button class="nav-btn up" id="scrollUp">↑</button>
        <button class="nav-btn down" id="scrollDown">↓</button>

        <section class="items-container">
            {% for item in items %}
            <article class="item-card">
                <a href="{% url 'item_detail' item.id %}" class="item-link">
                    <div class="item-visual">
                        <img src="{{ item.image.url }}" alt="{{ item.name }}" class="item-img">
                    </div>

                    <header class="item-header">
                        <h2 class="item-name">{{ item.name }}</h2>
                    </header>
                </a>
            </article>
            {% endfor %}
        </section>
    </main>

    <script src="{% static 'LOLGuide/js/items_list.js' %}"></script>
</body>
</html>
